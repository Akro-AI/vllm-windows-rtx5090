name: Build vLLM Windows wheel (RTX 5090 / sm_120 / cu130)

# Builds vLLM as a native Windows wheel from the SystemPanic/vllm-windows
# fork (the canonical Windows port with MSVC + CUDA-13 patches). Ships
# both the vllm wheel AND the exact torch / torchvision
# nightlies it was built against — consumers install all four with
# --no-deps and skip pip / uv resolution entirely. Avoids the "wheel
# pins torch==X.Y.Z+cu130 but that nightly rotated off the index"
# class of resolution failures we kept hitting before.
#
# Lineage: derived from the maintainer's local build at C:\vllm-windows
# (SystemPanic/vllm-windows @ 377ffb268 produced
# vllm-0.20.1.dev7+g377ffb268.cu132-cp312-cp312-win_amd64.whl). The
# original 377ffb268 SHA was force-pushed off vllm-for-windows and is
# no longer fetchable via git (GitHub does not enable
# uploadpack.allowAnySHA1InWant for that repo). We pin instead to the
# current branch tip 86482f6af — same patch set, 23 commits newer; CI
# is now the reproducibility anchor (the SHA above just records what
# the original local-machine build was based on).
#
# Cost: vLLM compilation on `windows-latest` runs ~60-90 min including
# CUDA install. Trigger manually (workflow_dispatch) for occasional
# rebuilds.

on:
  workflow_dispatch:
    inputs:
      vllm_windows_ref:
        description: 'SystemPanic/vllm-windows ref (tag/branch/commit). Defaults to current vllm-for-windows tip.'
        required: true
        default: '86482f6af'
      torch_arch:
        description: 'TORCH_CUDA_ARCH_LIST (Blackwell sm_120 = "12.0"; "12.0+PTX" forward-compat)'
        required: true
        default: '12.0+PTX'
      cuda_version:
        description: 'CUDA Toolkit version. 13.0+ needed for sm_120; 13.2 was the original build target.'
        required: true
        default: '13.2.0'
      release_tag:
        description: 'Release tag for the published wheels (e.g., vllm-0.20.1.dev7-cu130-py312-win-amd64-sm120)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350  # vllm compile (flash-attn + CK/CUTLASS GEMM for sm_120)
                          # exceeds 3h on the 4-core windows-latest runner
                          # (MAX_JOBS=4). iter 10 timed out at 180 mid-compile.
                          # 350 is under GitHub's 6h hosted-runner hard cap;
                          # warm CUDA+torch caches keep most of that for compile.
    env:
      # Build env per SystemPanic/vllm-windows README:
      DISTUTILS_USE_SDK: '1'
      VLLM_TARGET_DEVICE: 'cuda'
      MAX_JOBS: '4'  # windows-latest has 4 cores; over-subscription thrashes
      # FA3 is irrelevant on Windows (no Hopper). Keep the build short.
      VLLM_FORCE_FA3_WINDOWS_BUILD: '0'

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure MSVC dev env
        # windows-latest ships VS 2022 with C++ tools; this action plumbs
        # the env vars (INCLUDE, LIB, PATH) so cl.exe + nmake are
        # discoverable by setuptools + ninja. Equivalent to running
        # `vcvarsall.bat x64` from cmd, which the source README calls out.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Enable Windows long paths
        # vLLM-windows' README step #6 (directly above the build commands)
        # requires this. The build fetches Composable Kernel sources whose
        # tensor_operation_instance/gpu/<gemm-variant>/<deeply-nested-name>
        # paths blow past Windows' classic 260-char MAX_PATH inside
        # CMake's build dir.
        # Two flips:
        #   1. Registry LongPathsEnabled — flips per-process opt-in to ON
        #      for any app that checks it at startup (modern git, cmake,
        #      python file APIs). Effective immediately for processes
        #      spawned after this step; no reboot needed.
        #   2. git core.longpaths=true — git's own internal cap, separate
        #      from the OS flag.
        # Without these, iter 8 failed mid-compile with hundreds of
        # `error: unable to create file ...: Filename too long`.
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          git config --global core.longpaths true
          git config --system core.longpaths true
          Write-Host "Long paths enabled (registry + git)"

      - name: Restore CUDA Toolkit cache
        # CUDA install is the slowest non-build step (~5 min: ~3 GB local
        # installer download + extract + driver-registration). Caching the
        # extracted toolchain root cuts this to ~30s on warm runs. Cache
        # size is ~7 GB; GitHub's per-repo cache budget is 10 GB total.
        # Bumping the trailing -vN forces a fresh cache.
        #
        # Restore/save split: we use the restore action here and the
        # matching save action AFTER the install step, gated on
        # `if: always() && cache-hit != 'true'`. `actions/cache@v4`'s
        # `save-always: true` option is deprecated and (per GitHub's own
        # warning) "does not work as intended" — the only way to save a
        # cache when a later step fails is the explicit save action with
        # `if: always()`.
        id: cache-cuda-restore
        uses: actions/cache/restore@v4
        with:
          path: 'C:\Program Files\NVIDIA GPU Computing Toolkit'
          key: cuda-toolkit-${{ inputs.cuda_version }}-v1

      - name: Install CUDA Toolkit ${{ inputs.cuda_version }}
        # v0.2.32 first added CUDA 13.2.0 to the version table; v0.2.35 is
        # latest as of writing.
        # method: 'local' downloads the full offline installer + extracts —
        # 'network' (component-streaming) has been crashing the NVIDIA
        # installer with exit code 0xE0CB1799 on windows-latest for the
        # CUDA 13.x line. Trade-off: larger download (~3 GB) but reliable.
        # sub-packages is omitted under method=local — the local installer
        # places everything; we don't need to pick components.
        # Skipped on cache hit; CUDA_PATH is derived in the next step.
        if: steps.cache-cuda-restore.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda
        with:
          cuda: ${{ inputs.cuda_version }}
          method: 'local'

      - name: Save CUDA Toolkit cache
        # Runs even if a later step fails (`if: always()`), and skipped
        # when we already restored from cache (cache-hit != 'true' on the
        # restore step). Placed right after install so the cache is
        # persisted as soon as it's populated, before any downstream
        # failure can prevent the save.
        if: always() && steps.cache-cuda-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: 'C:\Program Files\NVIDIA GPU Computing Toolkit'
          key: cuda-toolkit-${{ inputs.cuda_version }}-v1

      - name: Export CUDA env vars (vLLM CMakeLists reads these)
        shell: pwsh
        run: |
          # On cache hit the Jimver action didn't run, so its CUDA_PATH
          # output is empty. Derive from the install dir directly — there's
          # only one version installed under the toolkit root.
          $cudaFromAction = "${{ steps.cuda.outputs.CUDA_PATH }}"
          if ($cudaFromAction) {
            $cuda = $cudaFromAction
          } else {
            $cuda = (Get-ChildItem "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA" -Directory `
                     | Sort-Object Name -Descending | Select-Object -First 1).FullName
            Write-Host "Restored from cache: CUDA_PATH=$cuda"
          }
          echo "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          echo "CUDA_HOME=$cuda" >> $env:GITHUB_ENV
          echo "CUDA_ROOT=$cuda" >> $env:GITHUB_ENV
          echo "$cuda\bin" >> $env:GITHUB_PATH
          echo "TORCH_CUDA_ARCH_LIST=${{ inputs.torch_arch }}" >> $env:GITHUB_ENV
          & "$cuda\bin\nvcc.exe" --version

      - name: Clone SystemPanic/vllm-windows @ ${{ inputs.vllm_windows_ref }}
        shell: pwsh
        run: |
          # PowerShell does NOT exit on native command failure by default —
          # without this, a failed `git checkout` silently no-ops and the
          # next step builds against the wrong tree.
          $ErrorActionPreference = 'Stop'
          function Check-Exit { if ($LASTEXITCODE -ne 0) { throw "command exited $LASTEXITCODE" } }

          # Top-level clone path matches the maintainer's local checkout
          # (C:\vllm-windows). Some fix scripts may reference absolute paths
          # in error messages — keeping the path consistent reduces drift.
          # Clone WITHOUT --recurse-submodules: submodule init runs against
          # the default branch, but we then checkout a different commit and
          # need to re-sync against that commit's submodule pins.
          git clone https://github.com/SystemPanic/vllm-windows.git C:\vllm-windows
          Check-Exit
          cd C:\vllm-windows

          # Plain `git clone` only populates the default branch's history,
          # so a SHA living on a sibling branch (vllm-for-windows) isn't
          # in the object DB yet. Empirically GitHub refuses
          # `git fetch origin <SHA>` on this repo even for reachable
          # commits — uploadpack.allowReachableSHA1InWant doesn't appear
          # to be set. So fetch the branch by NAME, then checkout the
          # SHA — the SHA becomes locally reachable via the branch ref.
          git fetch origin vllm-for-windows
          Check-Exit
          git checkout "${{ inputs.vllm_windows_ref }}"
          Check-Exit
          git submodule update --init --recursive
          Check-Exit
          $commit = git rev-parse --short HEAD
          echo "VLLM_COMMIT=$commit" >> $env:GITHUB_ENV
          Write-Host "vllm-windows at $commit"

      - name: Patch flash-attn build to C++20 (torch 2.13 headers need it)
        # Iter 9 compiled for ~1.5h then failed building _vllm_fa2_C:
        #   torch/include/c10/core/AutogradState.h(89): error C7582:
        #   'view_replay_enabled_': default member initializers for
        #   bit-fields requires at least '/std:c++20'
        #
        # The torch nightly we build against (2.13.0.dev) has C++20-only
        # constructs in its public headers. The main vllm-windows project
        # is already C++20 (CMakeLists sets CMAKE_CXX_STANDARD 20), but the
        # vllm-flash-attn subproject (FetchContent'd from
        # vllm-project/flash-attention) overrides the standard to C++17 for
        # its own targets, so any FA source including torch headers fails.
        # The maintainer never hit this because torch 2.11.0's headers were
        # still C++17-clean.
        #
        # vllm_flash_attn.cmake already force-overrides compile options on
        # the FA targets from the parent scope (precisely to defeat the
        # subproject's overrides). We inject CXX_STANDARD 20 + CUDA_STANDARD
        # 20 into that same foreach so both the .cpp host compiles and the
        # .cu host-side compiles pick up C++20. CUDA 13 supports C++20
        # device code, so CUDA_STANDARD 20 is valid and keeps host/device
        # standards consistent (avoids the nvcc host/device std-mismatch
        # that a bare -Xcompiler=/std:c++20 would risk).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $faCmake = "C:\vllm-windows\cmake\external_projects\vllm_flash_attn.cmake"
          $content = Get-Content $faCmake -Raw
          # Single-line anchor (avoids multi-line here-strings, which break
          # YAML block-scalar indentation). Insert set_target_properties
          # immediately after the `if(TARGET ${_fa_tgt})` line inside the
          # existing foreach over the FA targets. Single quotes keep
          # ${_fa_tgt} literal (no PowerShell expansion); the newline is
          # the only thing that needs a double-quoted segment.
          $anchor = '    if(TARGET ${_fa_tgt})'
          if (-not $content.Contains($anchor)) {
            throw "FA cmake anchor not found — upstream changed vllm_flash_attn.cmake; re-derive the patch"
          }
          $inject = '      set_target_properties(${_fa_tgt} PROPERTIES CXX_STANDARD 20 CUDA_STANDARD 20)'
          $content = $content.Replace($anchor, ($anchor + "`n" + $inject))
          Set-Content $faCmake -Value $content -NoNewline
          Write-Host "Patched FA targets to C++20 / CUDA C++20"

      - name: Restore pip wheel cache
        # Pip caches downloaded wheel files (responses-by-URL) under
        # %LOCALAPPDATA%\pip\Cache by default. ~2-3 GB after a torch nightly
        # install. Cuts the ~2.5 GB torch+vision+audio download portion on
        # same-day reruns (different-day reruns get a new nightly URL and
        # miss). Bump -vN to invalidate. Matching save action below.
        id: cache-pip-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: pip-cache-${{ runner.os }}-cu130-v1

      - name: Install torch nightly cu130 + build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip

          # ALWAYS run the install — do NOT cache/skip the installed
          # site-packages. iter 11 failed with `ModuleNotFoundError: No
          # module named 'torchgen'` after a selective-glob site-packages
          # cache "hit" restored torch/ but not torchgen/ (and other
          # torch-adjacent top-level packages + numpy). You can't reliably
          # hand-enumerate everything torch drags in, so caching installed
          # packages by glob produces a broken-but-present environment.
          # Instead we cache only the pip WHEEL cache (above): the slow part
          # is the ~2.5 GB download, and pip serves it from disk on warm
          # reruns while still doing a complete, consistent install here.
          # torchaudio is NOT installed/shipped — vLLM doesn't need it for
          # text/vision models (no audio), and dropping it avoids the stale
          # torchaudio==2.11.0+cpu staging mismatch we hit before.
          python -m pip install --pre `
            --index-url https://download.pytorch.org/whl/nightly/cu130 `
            --extra-index-url https://pypi.org/simple `
            torch torchvision
          if ($LASTEXITCODE -ne 0) { throw "torch install failed" }

          # Build tooling — small, fast to install, not worth caching
          # separately. setuptools-scm is required because vllm-windows
          # derives its version from git tags. setuptools is upper-bounded
          # because vllm's pyproject.toml pins `setuptools<81.0.0,>=77.0.3`
          # and `python -m build --no-isolation` will hard-fail with
          # "Missing dependencies: setuptools<81.0.0,>=77.0.3" if we have
          # 81+ installed (default pip pulls latest, currently 81.x).
          # setuptools-rust: vLLM grew a Rust frontend at 0.22, so its build
          # backend now asks for it in get_requires_for_build_wheel. We build
          # with `--no-isolation`, which means every backend requirement has to
          # be present here — without it the build dies in under a minute with
          # "ModuleNotFoundError: No module named 'setuptools_rust'", long
          # before any compilation starts.
          python -m pip install build cmake ninja packaging "setuptools>=77.0.3,<81.0.0" setuptools-rust setuptools-scm wheel

          # Snapshot versions for the release body + later --no-deps
          # download. Capture both — pinning only torch is a silent bug:
          # `pip download torchvision` without a version resolves to
          # whatever's newest on the nightly index, which on a different
          # nightly date has a different torch ABI than the one we built
          # against. The bundle ships a mutually-consistent torch+torchvision.
          $torchVer = python -c "import torch; print(torch.__version__)"
          $tvVer    = python -c "import torchvision; print(torchvision.__version__)"
          echo "TORCH_VERSION=$torchVer" >> $env:GITHUB_ENV
          echo "TORCHVISION_VERSION=$tvVer" >> $env:GITHUB_ENV
          Write-Host "Built against torch=$torchVer torchvision=$tvVer"

      - name: Save pip wheel cache
        # Runs even on later step failure; skipped if we restored from
        # cache (cache-hit on the restore step). Placed right after the
        # install so pip-cache contents are persisted before any
        # downstream failure.
        if: always() && steps.cache-pip-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: pip-cache-${{ runner.os }}-cu130-v1

      - name: Apply CUDA 13 alignment patch (cuda.h)
        # The README says to run this script before building when the
        # installed CUDA is 13.0 - 13.2 (13.3 reverts the breaking
        # alignment change). Script writes to the CUDA installation dir
        # so the runner's CUDA must be writable — `Jimver/cuda-toolkit`
        # installs to a runner-owned path, so no admin elevation needed.
        shell: pwsh
        run: |
          cd C:\vllm-windows
          python fix_cuda_13_align.py

      # NOTE: we deliberately do NOT invoke fix_cutlass_msvc.py as a
      # standalone step. It requires `sys.argv[1] = <cutlass-source-dir>`,
      # and CUTLASS isn't present until CMake FetchContent pulls it mid-
      # build. vllm_flash_attn.cmake already calls it automatically during
      # the build (`execute_process(... fix_cutlass_msvc.py
      # ${vllm-flash-attn_SOURCE_DIR}/csrc/cutlass)`), so the patch is
      # applied at the correct point with the correct path. Running it
      # ourselves at top level (no arg) is what raised the earlier
      # IndexError.

      - name: Switch build to use locally-installed torch (relax version pin)
        # Without this, the wheel's setup.py pins torch to the EXACT version
        # the maintainer originally built against (e.g. 2.11.0+cu130), and
        # PyTorch's nightly index rotates daily so that pin is unreachable
        # in days. use_existing_torch.py rewrites the pin to match the
        # currently-installed torch — same goal as our earlier --override
        # hack at install time, done once at build time instead.
        shell: pwsh
        run: |
          cd C:\vllm-windows
          python use_existing_torch.py

      - name: Build vllm wheel
        shell: pwsh
        working-directory: C:\vllm-windows
        run: |
          # `pip install . --no-build-isolation --no-deps` matches the
          # maintainer's command from buildlogs.txt. --no-build-isolation
          # is mandatory: an isolated build env would re-resolve torch and
          # likely pick the wrong CUDA flavor. --no-deps avoids pulling
          # transitive deps we ship separately.
          #
          # But pip install builds + installs; we want the wheel only.
          # Use python -m build instead which only produces dist/*.whl.
          # /FI cmath on the MSVC host compiler. CUTLASS's
          # tools/util/include/cutlass/util/reference/host/tensor_fill.h uses
          # NAN without including <cmath>; gcc gets it transitively, MSVC does
          # not, so 0.22's newer CUTLASS fails ~50 min into the compile with
          # "error C3861: 'NAN': identifier not found" across three call sites.
          # A forced include is the only lever available: CUTLASS arrives via
          # FetchContent during cmake configure, so there is nothing on disk to
          # patch before the build starts. -Xcompiler carries it through nvcc to
          # the host pass, which is where those TUs are compiled.
          $env:CMAKE_CXX_FLAGS  = "$env:CMAKE_CXX_FLAGS /FI`"cmath`""
          $env:CMAKE_CUDA_FLAGS = "$env:CMAKE_CUDA_FLAGS -Xcompiler /FI`"cmath`""

          python -m build --wheel --no-isolation
          Get-ChildItem dist | Format-Table Name, Length -AutoSize

      - name: Stage wheels (vllm + matching torch/torchvision)
        shell: pwsh
        run: |
          mkdir C:\stage
          Copy-Item C:\vllm-windows\dist\*.whl C:\stage\
          # Re-download the EXACT torch nightlies we built against. They're
          # already cached but `pip download` writes the wheel files we can
          # publish as release assets.
          python -m pip download --pre `
            --index-url https://download.pytorch.org/whl/nightly/cu130 `
            --extra-index-url https://pypi.org/simple `
            --no-deps `
            --dest C:\stage `
            "torch==$env:TORCH_VERSION" `
            "torchvision==$env:TORCHVISION_VERSION"

          Get-ChildItem C:\stage | Sort-Object Name | Format-Table Name, Length -AutoSize
          $wheels = (Get-ChildItem C:\stage -Filter *.whl | ForEach-Object { $_.Name }) -join "`n  - "
          echo "WHEEL_LIST<<EOF" >> $env:GITHUB_ENV
          echo "  - $wheels" >> $env:GITHUB_ENV
          echo "EOF" >> $env:GITHUB_ENV

      - name: Compute SHA-256 for each wheel (release body)
        id: sha
        shell: pwsh
        run: |
          $shas = Get-ChildItem C:\stage -Filter *.whl | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "  - ``$($_.Name)``: ``$h``"
          }
          $body = $shas -join "`n"
          echo "SHA_LINES<<EOF" >> $env:GITHUB_ENV
          echo "$body" >> $env:GITHUB_ENV
          echo "EOF" >> $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: C:\stage\*.whl
          body: |
            vLLM Windows wheel built from `SystemPanic/vllm-windows@${{ env.VLLM_COMMIT }}` (input ref: `${{ inputs.vllm_windows_ref }}`).

            ## Build environment

            | | |
            |---|---|
            | Runner | `windows-latest` (GitHub-hosted) |
            | Python | 3.12 |
            | CUDA Toolkit | ${{ inputs.cuda_version }} |
            | Target arch | `${{ inputs.torch_arch }}` (Blackwell sm_120) |
            | Torch | `${{ env.TORCH_VERSION }}` (nightly cu130) |
            | Torchvision | `${{ env.TORCHVISION_VERSION }}` |
            | Build command | `python -m build --wheel --no-isolation` |
            | Toolchain | MSVC (VS 2022) + ninja |

            Pre-build patches applied (from upstream vllm-windows tree):
            - `fix_cuda_13_align.py` — patches CUDA 13.0-13.2 cuda.h 128-byte alignment that MSVC chokes on
            - `use_existing_torch.py` — rewrites the wheel's exact torch pin (originally `torch==2.11.0`) to match the runtime-installed nightly, so the published wheel doesn't lock to a torch nightly that's already rotated off the index

            FA3 (Hopper-only) build skipped (`VLLM_FORCE_FA3_WINDOWS_BUILD=0`); NCCL deferred (see Open issues below).

            ## Assets

            ${{ env.WHEEL_LIST }}

            ### SHA-256 sums

            ${{ env.SHA_LINES }}

            ## Consumer install

            Install the three wheels together (let your resolver bind
            torchvision's torch== pin to the bundled torch). They were built
            as a unit. torchaudio is not shipped — vLLM doesn't need it for
            text/vision models.

            ```powershell
            uv pip install --python <venv-python> `
              vllm-*.whl torch-*.whl torchvision-*.whl
            ```

            ## Open issues

            - NCCL: SystemPanic/vllm-windows recommends building NCCL from
              `SystemPanic/nccl-windows` and pointing `VLLM_NCCL_SO_PATH`
              at the resulting `nccl.dll`. Not bundled in this workflow yet
              — single-GPU inference doesn't exercise NCCL at runtime, but
              tensor-parallel / multi-GPU inference will fail without it.
              Follow-up: add a sibling `build-nccl.yml` workflow and
              bundle the .dll here.
